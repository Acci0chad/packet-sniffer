<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="272" viewBox="0 0 1000 272" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
<title id="title">Packet sniffer workflow</title>
<desc id="desc">Five steps: network interface, Scapy sniff, handle function, protocol identification, terminal output. Unrecognized packets are skipped.</desc>
<style>
.flow{stroke-dasharray:5 5;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-10}}
@media(prefers-reduced-motion:reduce){.flow{animation:none}}
</style>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#050912"/><stop offset="1" stop-color="#102747"/></linearGradient>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#67e8f9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1000" height="272" rx="18" fill="url(#bg)"/>
<g font-family="monospace">
<text x="40" y="38" font-size="18" fill="#7dd3fc">PACKET SNIFFER / WORKFLOW</text>

<rect x="40" y="62" width="160" height="100" rx="8" fill="#0d1b2e" stroke="#4b6a8a"/>
<text x="56" y="84" font-size="11" fill="#5b7a99">01</text>
<text x="56" y="108" font-size="13" font-weight="bold" fill="#c1d5ea">NETWORK IFACE</text>
<text x="56" y="133" font-size="11" fill="#91abc6">eth0 / wlan0</text>
<text x="56" y="149" font-size="11" fill="#91abc6">live traffic</text>

<line class="flow" x1="204" y1="112" x2="226" y2="112" stroke="#67e8f9" stroke-width="1.5" marker-end="url(#ah)"/>

<rect x="230" y="62" width="160" height="100" rx="8" fill="#17142e" stroke="#a78bfa"/>
<text x="246" y="84" font-size="11" fill="#7b6fb3">02</text>
<text x="246" y="108" font-size="13" font-weight="bold" fill="#c4b5fd">SCAPY SNIFF()</text>
<text x="246" y="133" font-size="11" fill="#c1d5ea">captures each</text>
<text x="246" y="149" font-size="11" fill="#c1d5ea">packet live</text>

<line class="flow" x1="394" y1="112" x2="416" y2="112" stroke="#67e8f9" stroke-width="1.5" marker-end="url(#ah)"/>

<rect x="420" y="62" width="160" height="100" rx="8" fill="#17142e" stroke="#a78bfa"/>
<text x="436" y="84" font-size="11" fill="#7b6fb3">03</text>
<text x="436" y="108" font-size="13" font-weight="bold" fill="#c4b5fd">HANDLE(PKT)</text>
<text x="436" y="133" font-size="11" fill="#c1d5ea">IPv4 · IPv6</text>
<text x="436" y="149" font-size="11" fill="#c1d5ea">ARP</text>

<line class="flow" x1="584" y1="112" x2="606" y2="112" stroke="#67e8f9" stroke-width="1.5" marker-end="url(#ah)"/>

<rect x="610" y="62" width="160" height="100" rx="8" fill="#0b2a2e" stroke="#2dd4bf"/>
<text x="626" y="84" font-size="11" fill="#3b8f86">04</text>
<text x="626" y="108" font-size="13" font-weight="bold" fill="#5eead4">IDENTIFY PROTO</text>
<text x="626" y="133" font-size="11" fill="#c1d5ea">DNS · TCP</text>
<text x="626" y="149" font-size="11" fill="#c1d5ea">UDP · ICMP</text>

<line class="flow" x1="774" y1="112" x2="796" y2="112" stroke="#67e8f9" stroke-width="1.5" marker-end="url(#ah)"/>

<rect x="800" y="62" width="160" height="100" rx="8" fill="#0b2a2e" stroke="#2dd4bf"/>
<text x="816" y="84" font-size="11" fill="#3b8f86">05</text>
<text x="816" y="108" font-size="13" font-weight="bold" fill="#5eead4">PRINT OUTPUT</text>
<text x="816" y="133" font-size="11" fill="#c1d5ea">time · IPs</text>
<text x="816" y="149" font-size="11" fill="#c1d5ea">protocol · ports</text>

<line class="flow" x1="500" y1="164" x2="500" y2="192" stroke="#fb7185" stroke-width="1.5" marker-end="url(#ah2)"/>
<rect x="405" y="196" width="190" height="30" rx="6" fill="#2a1420" stroke="#fb7185"/>
<text x="500" y="215" font-size="11" fill="#fda4af" text-anchor="middle">other packets: skipped</text>

<text x="40" y="254" font-size="11" fill="#8099b5">Python · Scapy · Kali Linux</text>
</g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
